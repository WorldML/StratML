mode: beginner
dataset:
  path: data/raw/titanic.csv 
  target_column: Survived
execution:
  max_iterations: 5
  timeout_per_run: 300
  random_seed: 42
  tune: false  # strict paper protocol: 1 decision iteration = 1 model fit (no nested CV search)
split:
  method: stratified
  test_size: 0.2
logging:
  enable_mlflow: false
  enable_tensorboard: false
  log_level: info
constraints:
  max_memory: null
  max_cpu: null
deep_learning:
  enabled: false
  architecture: MLP
  epochs: 20
  learning_rate: 0.001
  batch_size: 32
